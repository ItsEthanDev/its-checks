# its-checks: managed
name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read package manager
        id: manager
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { packageManager } = JSON.parse(fs.readFileSync('package.json'));
          const [name, version] = packageManager.split('@');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\nversion=${version.split('+')[0]}\n`);
          NODE
      - uses: pnpm/action-setup@v4
        if: steps.manager.outputs.name == 'pnpm'
        with:
          version: ${{ steps.manager.outputs.version }}
          run_install: false
      - uses: oven-sh/setup-bun@v2
        if: steps.manager.outputs.name == 'bun'
        with:
          bun-version: ${{ steps.manager.outputs.version }}
      - name: Install npm or Yarn
        if: steps.manager.outputs.name == 'npm' || steps.manager.outputs.name == 'yarn'
        env:
          MANAGER: ${{ steps.manager.outputs.name }}
          VERSION: ${{ steps.manager.outputs.version }}
        run: npm install --global "$MANAGER@$VERSION"
      - name: Install locked dependencies
        env:
          HUSKY: "0"
          MANAGER: ${{ steps.manager.outputs.name }}
        run: |
          case "$MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            *) echo "Unsupported package manager: $MANAGER" >&2; exit 1 ;;
          esac
      - run: node --run check
